# Proposes a bounded merge of the decomp into Frigate; game/build code never runs
# with the publishing token. PR workflows run after human approval, and a local
# maintainer verifies both ROM SHA1s plus the native host tests before merge.
name: Frigate upstream sync
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: port-sync
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository == 'CallanCampos/Frigate'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare upstream PR using trusted main helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The helper is loaded before it merges, and invokes only git and gh.
          # Never execute a build, hook or helper from the incoming merged tree.
          git config core.hooksPath /dev/null
          gh auth setup-git
          python3 port/tools/upstream_sync.py
