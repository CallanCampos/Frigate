name: Frigate upstream sync

# Merges fuddlesworth/pokebw2's main into this repository's main every hour, so Frigate follows the decomp. It runs
# only in CallanCampos/pokebw2-native, not in forks of it. CI has no base ROMs, so the merge is checked with the no-ROM
# compile check of upstream's compile.yml, run inside this workflow because pushes made with GITHUB_TOKEN start no
# other workflow. Matching is verified locally by port/tools/sync_upstream.sh, which every port session runs first.
#
# Two jobs. "merge" runs upstream's code (compile_all.py, and the compilers that configure.py downloads) with a
# read-only token. "publish" runs none of it: it makes the same merge again, pushes it only when the tree outside port/
# is the one that compiled, and reports. It treats what "merge" outputs as untrusted.
#
# It pushes only while the tree outside the port's own files is upstream's. GITHUB_TOKEN can't push commits that change
# .github/workflows/, so a merge that brings such a change is left to the local sync. Whatever this repository's
# visibility, it doesn't push commits whose messages name issues in other repositories (ADR 0002). A conflict, a
# compile failure, a workflow change, game files that differ from upstream, such a commit or a rewrite of upstream's
# history opens one issue labeled upstream-sync. See port/docs/SYNC.md.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: port-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: fuddlesworth/pokebw2
  UPSTREAM_URL: https://github.com/fuddlesworth/pokebw2.git
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: main
  SYNC_LABEL: upstream-sync

jobs:
  merge:
    name: Merge and compile
    if: github.repository == 'CallanCampos/pokebw2-native'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      result: ${{ steps.compile.outputs.result || steps.merge.outputs.result || steps.check.outputs.result || 'error' }}
      upstream: ${{ steps.check.outputs.upstream }}
      upstream_old: ${{ steps.check.outputs.upstream_old }}
      port_before: ${{ steps.check.outputs.port_before }}
      differing: ${{ steps.merge.outputs.differing || steps.check.outputs.differing }}
      fingerprint: ${{ steps.merge.outputs.fingerprint }}
      details: ${{ steps.compile.outputs.details || steps.merge.outputs.details }}
      log_tail: ${{ steps.compile.outputs.log_tail }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0
          # This job runs upstream's code and pushes nothing, so the token is not kept in the checkout
          persist-credentials: false

      - name: Fetch upstream
        id: check
        run: |
          set -euo pipefail
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "$UPSTREAM_URL"
          else
            git remote add upstream "$UPSTREAM_URL"
          fi
          git fetch --no-tags upstream "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          upstream=$(git rev-parse "refs/remotes/upstream/$UPSTREAM_BRANCH")

          # The upstream commit that the newest sync merge recorded in its Upstream-Commit trailer, or before the first
          # sync the merge base
          message=$(git log --merges -E --grep='^Upstream-Commit: [0-9a-f]{40}$' -n 1 --format=%B HEAD)
          last=$(printf '%s\n' "$message" | sed -n 's/^Upstream-Commit: \([0-9a-f]\{40\}\)$/\1/p' | tail -n 1)
          if [ -z "$last" ]; then
            last=$(git merge-base HEAD "$upstream")
          fi
          {
            echo "upstream=$upstream"
            echo "upstream_old=$last"
            echo "port_before=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

          # Checked before "already merged", which also holds when upstream went back to an older commit
          if ! git merge-base --is-ancestor "$last" "$upstream"; then
            echo "::error::Upstream $UPSTREAM_BRANCH no longer contains $last, the last upstream commit merged here."
            echo "result=rewrite" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$upstream" HEAD; then
            echo "$UPSTREAM_REPO@${upstream:0:9} is already merged into $SYNC_BRANCH."
            differing=$(git diff --name-only "$upstream" HEAD -- . ':(exclude)port' ':(exclude).github/README.md' \
              ':(exclude).github/workflows/port-*.yml' | wc -l | tr -d ' ')
            {
              echo "result=up-to-date"
              echo "differing=$differing"
            } >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # Merges upstream and stops at what blocks a push: a conflict, a change to workflow files, or game files that
      # differ from upstream. Each ends the step with exit 0 and leaves the verdict to the publish job.
      - name: Merge
        id: merge
        if: steps.check.outputs.needed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.upstream }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/port-sync"
          mkdir -p "$out"
          : > "$out/details"
          result=error
          differing=""
          # put NAME FILE: a multiline output, when FILE isn't empty
          put() {
            local delimiter
            [ -s "$2" ] || return 0
            delimiter="$1_$(openssl rand -hex 16)"
            {
              echo "$1<<$delimiter"
              cat "$2"
              [ -z "$(tail -c 1 "$2")" ] || echo
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }
          finish() {
            {
              echo "result=$result"
              echo "differing=$differing"
            } >> "$GITHUB_OUTPUT"
            put details "$out/details"
          }
          trap finish EXIT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          base=$(git rev-parse HEAD)
          echo "Merging $(git rev-list --count "HEAD..$UPSTREAM_SHA") upstream commits up to ${UPSTREAM_SHA:0:9}"
          printf 'Merge upstream %s@%s\n\nUpstream-Commit: %s\n' "$UPSTREAM_REPO" "${UPSTREAM_SHA:0:9}" \
            "$UPSTREAM_SHA" > "$out/message"
          if ! git merge --no-ff --no-edit -F "$out/message" "$UPSTREAM_SHA"; then
            git diff --name-only --diff-filter=U > "$out/details"
            git merge --abort || true
            if [ ! -s "$out/details" ]; then
              echo "::error::git merge failed without conflicting files."
              exit 1
            fi
            result=conflict
            exit 0
          fi

          # GITHUB_TOKEN can't push a commit that adds or changes a workflow file: check the new upstream commits
          # one by one, and the merge as a whole
          {
            git diff --name-only "$base" HEAD -- .github/workflows
            git log --full-history --format= --name-only "$base..$UPSTREAM_SHA" -- .github/workflows
          } | sed '/^$/d' | sort -u > "$out/workflows"
          if [ -s "$out/workflows" ]; then
            echo "::warning::The merge changes workflow files, which GITHUB_TOKEN can't push:"
            cat "$out/workflows"
            # A new workflow file is enabled here once pushed; one that needs upstream's secrets then fails here
            added=$(git diff --name-only --diff-filter=AR "$base" HEAD -- .github/workflows)
            secrets=""
            for file in .github/workflows/*.yml .github/workflows/*.yaml; do
              [ -f "$file" ] || continue
              case "$file" in .github/workflows/port-*) continue ;; esac
              names=$({ grep -o 'secrets\.[A-Za-z0-9_]*' "$file" || true; } | sort -u |
                { grep -vx 'secrets\.GITHUB_TOKEN' || true; } | paste -sd ' ' -)
              if [ -n "$names" ]; then
                secrets="$secrets  $file: $names"$'\n'
              fi
            done
            {
              echo "Changed by the merge or by the upstream commits in it:"
              sed 's/^/  /' "$out/workflows"
              echo "Added or renamed upstream, so enabled here once pushed:"
              if [ -n "$added" ]; then printf '%s\n' "$added" | sed 's/^/  /'; else echo "  none"; fi
              echo "Using secrets other than GITHUB_TOKEN, which this repository doesn't have:"
              if [ -n "$secrets" ]; then printf '%s' "$secrets"; else echo "  none"; fi
            } > "$out/details"
            result=workflows
            exit 0
          fi

          # A push without a ROM build is only safe while the tree outside the port's own files is upstream's. Once
          # it differs, the merge needs the local sync, see "When the port changes game files" in SYNC.md.
          git diff --name-only "$UPSTREAM_SHA" HEAD -- . ':(exclude)port' ':(exclude).github/README.md' \
            ':(exclude).github/workflows/port-*.yml' > "$out/differing"
          differing=$(wc -l < "$out/differing" | tr -d ' ')
          if [ "$differing" -gt 0 ]; then
            echo "::warning::$differing files outside port/ differ from upstream; the merge needs a ROM build."
            head -n 50 "$out/differing" > "$out/details"
            if [ "$differing" -gt 50 ]; then
              echo "and $((differing - 50)) more" >> "$out/details"
            fi
            result=needs-rom-check
            exit 0
          fi

          # compile_all.py reads nothing in port/, so the publish job may push any merge whose tree outside port/
          # has this fingerprint
          fingerprint=$(git ls-tree HEAD | awk -F '\t' '$2 != "port"' | git hash-object --stdin)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          result=merged

      - name: Set up Python
        if: steps.merge.outputs.result == 'merged'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The same tools and key as compile.yml, so the two workflows share one cache
      - name: Cache tools
        if: steps.merge.outputs.result == 'merged'
        uses: actions/cache@v6
        with:
          path: |
            tools/wibo
            tools/sjiswrap.exe
            tools/objdiff-cli
            tools/mwccarm
          key: tools-${{ hashFiles('configure.py', 'lib/*/library.toml') }}

      - name: Compile
        id: compile
        if: steps.merge.outputs.result == 'merged'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/port-sync"
          result=error
          : > "$out/details"
          : > "$out/tail"
          put() {
            local delimiter
            [ -s "$2" ] || return 0
            delimiter="$1_$(openssl rand -hex 16)"
            {
              echo "$1<<$delimiter"
              cat "$2"
              [ -z "$(tail -c 1 "$2")" ] || echo
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }
          finish() {
            echo "result=$result" >> "$GITHUB_OUTPUT"
            put details "$out/details"
            put log_tail "$out/tail"
          }
          trap finish EXIT

          echo "::group::compile_all.py"
          status=0
          PYTHONUNBUFFERED=1 python tools/decomp/compile_all.py 2>&1 | tee "$out/compile.log" || status=$?
          echo "::endgroup::"
          if [ "$status" -ne 0 ]; then
            # The files that failed, which tell one compile failure from another. compile_all.py prints
            # "<source> (<version>):" before a file's compiler output, and "<source> (<version>): compiler exited
            # with status N" for a failure with no output; MWCC's errors contain "Error", its warnings don't.
            awk '
              NF == 2 && / \([a-z0-9_]+\):$/ { file = substr($0, 1, length($0) - 1); next }
              /\): compiler exited with status / { sub(/: compiler exited with status .*/, ""); print; next }
              /Error/ && file != "" { print file }
            ' "$out/compile.log" | sort -u > "$out/details"
            if [ ! -s "$out/details" ]; then
              echo "(no source file named; see the end of the log)" > "$out/details"
            fi
            tail -n 60 "$out/compile.log" > "$out/tail"
            echo "::error::The merged tree doesn't compile: $(tail -n 1 "$out/compile.log")"
            result=compile-failed
            exit 0
          fi
          result=ready

  publish:
    name: Push and report
    needs: merge
    if: ${{ !cancelled() && github.repository == 'CallanCampos/pokebw2-native' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout main
        if: needs.merge.outputs.result == 'ready'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0

      # Each attempt makes the merge job's merge again on the current main and pushes it if the tree outside port/
      # is the one that compiled and no commit it adds names an issue in another repository. A push refused because
      # main moved starts the next attempt from the new main. A main that changed outside port/ meanwhile is left to
      # the next run, which compiles again. The step ends with exit 0 for every outcome it understands and leaves the
      # verdict to the report.
      - name: Push
        id: push
        if: needs.merge.outputs.result == 'ready'
        env:
          UPSTREAM_SHA: ${{ needs.merge.outputs.upstream }}
          FINGERPRINT: ${{ needs.merge.outputs.fingerprint }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/port-sync"
          mkdir -p "$out"
          result=error
          count=""
          port_after=""
          references=""
          closing=""
          finish() {
            {
              echo "result=$result"
              echo "count=$count"
              echo "port_after=$port_after"
              echo "references=$references"
              echo "closing=$closing"
            } >> "$GITHUB_OUTPUT"
          }
          trap finish EXIT

          # A commit message that names an issue, pull request or discussion in another repository: OWNER/REPO#N or
          # its github.com URL. Pushed here, it can put a "referenced" event naming this repository on that item's
          # timeline (ADR 0002). People who can't read a private repository still see such a reference, without its
          # details, so the check runs whatever this repository's visibility (SYNC.md). The same patterns as in
          # port/tools/sync_upstream.sh.
          reference_short='[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+'
          reference_url='github\.com/[^/[:space:]]+/[^/[:space:]]+/(issues|pull|discussions)/[0-9]+'
          # A closing keyword with an issue of this repository ("fixes #3"), which closes it once on main
          closing_keyword='(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+(#|GH-)[0-9]+'

          # The merge job ran upstream's code, so its outputs are checked before git sees them
          for value in "$UPSTREAM_SHA" "$FINGERPRINT"; do
            if ! [[ "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The merge job returned an unexpected value: $value"
              exit 1
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_URL"
          # This job holds the write token and never pushes upstream: the push URL is disabled as in a port clone
          git remote set-url --push upstream DISABLED-port-never-pushes-upstream
          git fetch --no-tags upstream "+refs/heads/$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          if ! git merge-base --is-ancestor "$UPSTREAM_SHA" "refs/remotes/upstream/$UPSTREAM_BRANCH"; then
            echo "::warning::Upstream $UPSTREAM_BRANCH no longer contains ${UPSTREAM_SHA:0:9}; the next run decides."
            result=moved
            exit 0
          fi
          printf 'Merge upstream %s@%s\n\nUpstream-Commit: %s\n' "$UPSTREAM_REPO" "${UPSTREAM_SHA:0:9}" \
            "$UPSTREAM_SHA" > "$out/message"

          for attempt in 1 2 3; do
            base=$(git rev-parse HEAD)
            if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
              echo "$SYNC_BRANCH already contains $UPSTREAM_REPO@${UPSTREAM_SHA:0:9}; another sync pushed it first."
              result=up-to-date
              port_after=$base
              exit 0
            fi
            echo "Attempt $attempt: merging $UPSTREAM_REPO@${UPSTREAM_SHA:0:9} into $SYNC_BRANCH (${base:0:9})"
            if ! git merge --no-ff --no-edit -F "$out/message" "$UPSTREAM_SHA"; then
              git merge --abort || true
              echo "::warning::The merge conflicts with the current $SYNC_BRANCH; the next run reports it."
              result=moved
              exit 0
            fi
            # The fingerprint covers .github/ too, so a merge that passes it changes no workflow file here either
            if [ "$(git ls-tree HEAD | awk -F '\t' '$2 != "port"' | git hash-object --stdin)" != "$FINGERPRINT" ]; then
              echo "::warning::$SYNC_BRANCH changed outside port/ since the compile; the next run compiles again."
              result=moved
              exit 0
            fi
            # Exactly the commits this push adds to main. Only their short SHAs are kept, oldest first, never the
            # text that matched: everyone who can read this repository can read this log and the issue.
            closing=$(git rev-list -i -E --reverse --abbrev-commit --abbrev=9 --grep="$closing_keyword" "$base..HEAD" |
              paste -sd ' ' -)
            if [ -n "$closing" ]; then
              echo "::warning::Commits with a closing keyword for an issue number of this repository: $closing"
            fi
            references=$(git rev-list -i -E --reverse --abbrev-commit --abbrev=9 --grep="$reference_short" \
              --grep="$reference_url" "$base..HEAD" | paste -sd ' ' -)
            if [ -n "$references" ]; then
              echo "::warning::Commits that name issues in other repositories, not pushed: $references"
              result=references
              exit 0
            fi
            count=$(git rev-list --count "$base..$UPSTREAM_SHA")
            if git push origin "HEAD:$SYNC_BRANCH" 2> "$out/push.err"; then
              cat "$out/push.err" >&2
              result=pushed
              port_after=$(git rev-parse HEAD)
              exit 0
            fi
            cat "$out/push.err" >&2
            git fetch --no-tags origin "+refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
            if [ "$(git rev-parse "refs/remotes/origin/$SYNC_BRANCH")" = "$base" ]; then
              echo "::error::The push was refused although $SYNC_BRANCH didn't move."
              result=push-failed
              exit 0
            fi
            echo "$SYNC_BRANCH moved during the sync; merging again onto the new $SYNC_BRANCH."
            # Only this runner's copy: drops the merge commit made above, which was never pushed
            git reset --hard "refs/remotes/origin/$SYNC_BRANCH"
          done
          echo "::error::$SYNC_BRANCH kept moving; gave up after 3 attempts."
          result=push-failed

      # Writes the job summary, then opens, updates or closes the one upstream-sync issue. A blocked sync fails the
      # job when the blocker is new (or changes), so GitHub notifies once; while the same blocker stays, later runs
      # only update the issue and end with a warning, instead of a failure notification every hour. A merge that
      # needs a local sync only because of workflow files or because game files differ from upstream is an expected
      # limit, not a fault, so it never fails the job: the issue is the signal.
      - name: Report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.push.outputs.result || needs.merge.outputs.result || 'error' }}
          UPSTREAM_SHA: ${{ needs.merge.outputs.upstream }}
          UPSTREAM_OLD: ${{ needs.merge.outputs.upstream_old }}
          PORT_BEFORE: ${{ needs.merge.outputs.port_before }}
          PORT_AFTER: ${{ steps.push.outputs.port_after }}
          COUNT: ${{ steps.push.outputs.count }}
          REFERENCES: ${{ steps.push.outputs.references }}
          CLOSING: ${{ steps.push.outputs.closing }}
          DIFFERING: ${{ needs.merge.outputs.differing }}
          DETAILS: ${{ needs.merge.outputs.details }}
          LOG_TAIL: ${{ needs.merge.outputs.log_tail }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/port-sync"
          mkdir -p "$out"

          # Most of these come from the merge job, which ran upstream's code: keep only well-formed values, and
          # never let its text close a code fence
          case "$RESULT" in
            up-to-date | pushed | moved | conflict | workflows | compile-failed | needs-rom-check | references | \
              rewrite | push-failed) ;;
            *) RESULT=error ;;
          esac
          for name in UPSTREAM_SHA UPSTREAM_OLD PORT_BEFORE PORT_AFTER; do
            if ! [[ "${!name}" =~ ^[0-9a-f]{40}$ ]]; then
              printf -v "$name" '%s' ""
            fi
          done
          [[ "$COUNT" =~ ^[0-9]+$ ]] || COUNT=""
          [[ "$DIFFERING" =~ ^[0-9]+$ ]] || DIFFERING=""
          # Short SHAs only
          shas() {
            local sha
            for sha in $1; do
              if [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then printf '%s\n' "$sha"; fi
            done
          }
          shas "$REFERENCES" > "$out/references"
          shas "$CLOSING" > "$out/closing"
          if [ "$RESULT" = references ] && [ ! -s "$out/references" ]; then
            RESULT=error
          fi

          # Text from git, the compiler and upstream's CI goes into the issue and summary. GitHub's docs don't
          # say whether references and mentions inside code blocks are linked, so a reference to an issue in another
          # repository and an @mention are broken up: OWNER/REPO#N gets a fullwidth number sign, the github.com of
          # an OWNER/REPO URL becomes github[.]com, and @name gets a fullwidth commercial at.
          fullwidth_hash=$(printf '\357\274\203')
          fullwidth_at=$(printf '\357\274\240')
          neutralize() {
            tr '`' "'" | sed -E \
              -e "s~([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)#([0-9])~\\1$fullwidth_hash\\2~g" \
              -e 's~[Gg][Ii][Tt][Hh][Uu][Bb]\.[Cc][Oo][Mm]/([^/[:space:]]+/[^/[:space:]]+)~github[.]com/\1~g' \
              -e "s~(^|[^A-Za-z0-9_.+-])@([A-Za-z0-9])~\\1$fullwidth_at\\2~g"
          }
          printf '%s\n' "$DETAILS" | neutralize > "$out/details"
          printf '%s\n' "$LOG_TAIL" | neutralize > "$out/tail"

          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          run_url="$repo_url/actions/runs/$GITHUB_RUN_ID"
          up_url="https://github.com/$UPSTREAM_REPO"
          short=${UPSTREAM_SHA:0:9}

          case "$RESULT" in
            up-to-date) what="Nothing to merge: upstream main is already in $SYNC_BRANCH." ;;
            pushed) what="Merged and pushed." ;;
            moved) what="$SYNC_BRANCH or upstream changed during the run; nothing was pushed." ;;
            conflict) what="The merge conflicts; nothing was pushed." ;;
            workflows) what="The merge changes workflow files, which GITHUB_TOKEN can't push; sync locally." ;;
            compile-failed) what="The merged tree fails compile_all.py; nothing was pushed." ;;
            needs-rom-check) what="Files outside port/ differ from upstream, so the merge needs a ROM build." ;;
            references) what="Commits name issues in other repositories; nothing was pushed." ;;
            rewrite) what="Upstream's history was rewritten; nothing was merged." ;;
            push-failed) what="The push was refused; nothing was pushed." ;;
            *) what="The job failed before it finished; see the log." ;;
          esac

          # What upstream's own CI said about the commit, for the record: the Action neither waits for it nor needs it
          checks="unknown"
          if [ -n "$UPSTREAM_SHA" ]; then
            checks=$(gh api "repos/$UPSTREAM_REPO/commits/$UPSTREAM_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | "\(.name): \(.conclusion // .status)"] | sort | join(", ")' 2>/dev/null |
              tr '|' '/' | neutralize || true)
            checks=${checks:-unknown}
          fi

          commit_link() {
            if [ -n "$2" ]; then printf '[`%s`](%s/commit/%s)' "${2:0:9}" "$1" "$2"; else printf 'unknown'; fi
          }
          {
            printf '## Upstream sync: %s\n\n%s\n\n' "$RESULT" "$what"
            printf '| | |\n| --- | --- |\n'
            printf '| Upstream last merged | %s |\n' "$(commit_link "$up_url" "$UPSTREAM_OLD")"
            printf '| Upstream main | %s |\n' "$(commit_link "$up_url" "$UPSTREAM_SHA")"
            printf '| Upstream CI on it | %s |\n' "$checks"
            printf '| Upstream commits merged | %s |\n' "$([ "$RESULT" = pushed ] && echo "${COUNT:-0}" || echo 0)"
            printf '| Port main before | %s |\n' "$(commit_link "$repo_url" "$PORT_BEFORE")"
            printf '| Port main after | %s |\n' "$(commit_link "$repo_url" "${PORT_AFTER:-$PORT_BEFORE}")"
            if [ "$DIFFERING" = 0 ]; then
              printf '| Outside `port/` | the same as upstream at the merged commit |\n'
            elif [ -n "$DIFFERING" ]; then
              printf '| Outside `port/` | %s files differ from upstream: this workflow no longer pushes |\n' \
                "$DIFFERING"
            fi
            if [ -s "$out/references" ]; then
              printf '| Naming issues in other repositories | %s commits, not pushed: %s |\n' \
                "$(wc -l < "$out/references" | tr -d ' ')" "$(sed 's/.*/`&`/' "$out/references" | paste -sd ' ' -)"
            fi
            if [ -s "$out/closing" ]; then
              printf '| With a closing keyword for an issue here | %s |\n' \
                "$(sed 's/.*/`&`/' "$out/closing" | paste -sd ' ' -)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$UPSTREAM_SHA" ]; then
            exit 0
          fi
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$SYNC_LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          # What blocked the sync last, recorded in the issue so that a later run can tell a new blocker from the same
          # one
          previous=""
          if [ -n "$issue" ]; then
            body=$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            previous=$(printf '%s\n' "$body" | sed -n 's/^<!-- port-sync-state: \(.*\) -->$/\1/p' | tail -n 1)
          fi

          case "$RESULT" in
            pushed)
              if [ -n "$issue" ]; then
                gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment \
                  "Merged $UPSTREAM_REPO@$short ($COUNT commits) into $SYNC_BRANCH as ${PORT_AFTER:0:9} in $run_url."
              fi
              exit 0
              ;;
            up-to-date)
              if [ -n "$issue" ]; then
                if [ "${DIFFERING:-0}" -gt 0 ] && [ "$previous" = needs-rom-check ]; then
                  echo "Issue #$issue stays open: files outside port/ still differ from upstream."
                else
                  gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment \
                    "$SYNC_BRANCH (${PORT_BEFORE:0:9}) already contains $UPSTREAM_REPO@$short, checked in $run_url."
                fi
              fi
              exit 0
              ;;
            moved)
              echo "::notice::$what"
              exit 0
              ;;
            conflict | workflows | compile-failed | needs-rom-check | references | rewrite | push-failed) ;;
            *) exit 0 ;;
          esac

          details_hash=$(sha256sum "$out/details" | cut -c1-12)
          case "$RESULT" in
            conflict | workflows | compile-failed) key="$RESULT $details_hash" ;;
            needs-rom-check) key="needs-rom-check" ;;
            # The oldest such commit, which stays first while upstream adds commits on top
            references) key="references $(head -n 1 "$out/references")" ;;
            rewrite) key="rewrite $UPSTREAM_OLD" ;;
            *) key="push-failed $UPSTREAM_SHA $GITHUB_RUN_ID" ;;
          esac
          new_blocker=false
          if [ "$key" != "$previous" ]; then
            new_blocker=true
          fi

          fence='```'
          {
            printf '<!-- port-sync-state: %s -->\n' "$key"
            printf 'The hourly [upstream sync](%s) could not bring [%s@%s](%s/commit/%s) into `%s`.\n\n' \
              "$run_url" "$UPSTREAM_REPO" "$short" "$up_url" "$UPSTREAM_SHA" "$SYNC_BRANCH"
            printf '**%s**\n\n' "$what"
            case "$RESULT" in
              conflict)
                printf 'Conflicting files:\n\n%s\n' "$fence"
                cat "$out/details"
                printf '%s\n\n' "$fence"
                ;;
              workflows)
                printf 'GITHUB_TOKEN has no permission to push changes under `.github/workflows/`.\n\n%s\n' "$fence"
                cat "$out/details"
                printf '%s\n\n' "$fence"
                printf 'After the local sync, run `gh workflow list --all -R %s`. `build.yml` must still ' \
                  "$GITHUB_REPOSITORY"
                printf 'be disabled. A workflow added or renamed upstream runs here from that push on, and one that '
                printf 'uses secrets this repository lacks fails on every push: ask the user before disabling it '
                printf '(`port/CLAUDE.md`).\n\n'
                ;;
              compile-failed)
                printf 'Either upstream main does not compile (the next run retries once it is fixed), or a change '
                printf 'outside `port/` in this repository breaks it. Files that failed:\n\n%s\n' "$fence"
                cat "$out/details"
                printf '%s\n\n' "$fence"
                printf '<details><summary>End of the compile_all.py log</summary>\n\n%s\n' "$fence"
                cat "$out/tail"
                printf '%s\n\n</details>\n\n' "$fence"
                ;;
              needs-rom-check)
                printf 'Files outside `port/` differ from upstream (%s in all), so a clean merge can still change ' \
                  "$DIFFERING"
                printf 'what the ROM build produces. This workflow no longer pushes merges to `%s`; the local sync, ' \
                  "$SYNC_BRANCH"
                printf 'which builds both ROMs, publishes them. The pull request mode of "When the port changes game '
                printf 'files" in `port/docs/SYNC.md` is now due. This issue stays open while the files differ.\n\n'
                printf '%s\n' "$fence"
                cat "$out/details"
                printf '%s\n\n' "$fence"
                ;;
              references)
                # Short SHAs as code, never links, and never the text that matched
                printf 'The messages of these commits, which the push would add to `%s`, ' "$SYNC_BRANCH"
                printf 'name an issue, pull request or discussion in another repository, in the form OWNER/REPO and '
                printf 'a number, or its URL:\n\n'
                head -n 50 "$out/references" | sed 's/.*/- `&`/'
                total=$(wc -l < "$out/references" | tr -d ' ')
                if [ "$total" -gt 50 ]; then
                  printf -- '- and %s more\n' "$((total - 50))"
                fi
                printf '\nPushed here, such a commit can put a reference from this repository on that item'"'"'s '
                printf 'timeline, which ADR 0002 rules out unless the user accepts it. People who can'"'"'t read a '
                printf 'private repository still see such a reference, without its details, so this check runs '
                printf 'whatever this repository'"'"'s visibility, and making it private doesn'"'"'t clear it. The '
                printf 'matched text is not repeated here; read it locally with `git show -s SHA`. See "Commit '
                printf 'messages that name other repositories" in `port/docs/SYNC.md`.\n\n'
                printf 'Only the user decides. Until then, upstream'"'"'s later commits wait too. To accept the '
                printf 'reference, sync locally in a clone with the base ROMs set up '
                printf '(`port/tools/bootstrap_checkout.sh`):\n\n'
                printf '%ssh\nport/tools/sync_upstream.sh --allow-references\n%s\n\n' "$fence" "$fence"
                printf 'The script builds both ROMs, checks both SHA1s and pushes. The next hourly run then closes '
                printf 'this issue.\n\n'
                ;;
              rewrite)
                printf 'Upstream main no longer contains [`%s`](%s/commit/%s), the last upstream commit merged ' \
                  "${UPSTREAM_OLD:0:9}" "$up_url" "$UPSTREAM_OLD"
                printf 'here, so its history was rewritten. A merge would bring in both histories. Decide by hand; '
                printf 'see "Upstream rewrote its history" in `port/docs/SYNC.md`.\n\n'
                ;;
              push-failed)
                printf 'git push said:\n\n%s\n' "$fence"
                neutralize < "$out/push.err" 2>/dev/null || true
                printf '%s\n\n' "$fence"
                ;;
            esac
            if [ "$RESULT" != rewrite ] && [ "$RESULT" != references ]; then
              printf '### Sync locally\n\n'
              printf 'In a clone of this repository with the base ROMs set up (`port/tools/bootstrap_checkout.sh`):\n\n'
              printf '%ssh\nport/tools/sync_upstream.sh\n%s\n\n' "$fence" "$fence"
              if [ "$RESULT" = conflict ]; then
                printf 'It stops with the merge in progress. Resolve the files above, then:\n\n'
                printf '%ssh\ngit add FILE...\ngit commit --no-edit --cleanup=strip\n' "$fence"
                printf 'port/tools/sync_upstream.sh\n%s\n\n' "$fence"
              fi
              printf 'The script builds both ROMs, checks both SHA1s and pushes.'
              if [ "$RESULT" != needs-rom-check ]; then
                printf ' The next hourly run then closes this issue.'
              fi
              printf '\n\n'
            fi
            printf 'Last updated by %s.\n' "$run_url"
          } > "$out/issue.md"

          title="Upstream sync blocked: $RESULT"
          if [ -z "$issue" ]; then
            gh label create "$SYNC_LABEL" --repo "$GITHUB_REPOSITORY" --color B60205 --force \
              --description "The hourly upstream sync needs a person" >/dev/null
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label "$SYNC_LABEL" \
              --body-file "$out/issue.md")
            issue=${url##*/}
            echo "Opened $url"
          else
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$out/issue.md" >/dev/null
            if [ "$new_blocker" = true ]; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
                --body "The sync is now blocked by: $what The description is updated ($run_url)."
            fi
            echo "Updated issue #$issue"
          fi
          printf '\nIssue: %s/issues/%s\n' "$repo_url" "$issue" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RESULT" = workflows ] || [ "$RESULT" = needs-rom-check ]; then
            echo "::warning::A local sync is needed (port/tools/sync_upstream.sh), see issue #$issue."
            exit 0
          fi
          if [ "$new_blocker" = true ]; then
            echo "::error::$what See issue #$issue."
            exit 1
          fi
          echo "::warning::Still blocked by the same problem as before, see issue #$issue."
