name: Frigate CI

# Builds Frigate, the native port, on macOS, Linux and Windows and runs its tests, those that need the player's ROM
# skipping. The ROM build needs the base ROMs, which CI doesn't have; upstream's compile.yml compiles every C file with
# MWCC instead, and every port session's sync builds both ROMs locally (port/docs/SYNC.md).
#
# Four build groups: the development build on macOS and Linux (host), as port/README.md's quick start makes it; the same on
# Windows (host-windows), with MSYS2's CLANG64 toolchain (clang, lld and the UCRT;
# port/docs/adr/0013-windows-build-with-msys2-clang64.md); the macOS distribution build (macos-distribution,
# port/docs/adr/0015-universal-macos-app-for-macos-11.md), one universal app, arm64 and x86_64, for macOS 11.0 and later,
# made and tested on Apple Silicon and on Intel, with macOS 26 and with macOS 15, the oldest runners that aren't
# deprecated; and the sanitized build on macOS and Linux (sanitize, port/docs/sanitizers.md,
# port/docs/adr/0014-sanitized-build-game-heaps-poisoned-ds-isms-ignorelisted.md). Each job builds its own copy and
# uploads nothing: the port's compiled game code is never uploaded (port/CLAUDE.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl3

      # SDL3 is built from its pinned release here, which needs the window system's development packages
      # (https://wiki.libsdl.org/SDL3/README-linux#build-dependencies)
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgl-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Configure
        env:
          CC: clang
        run: cmake -S port -B build/port -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build/port

      - name: Test
        run: ctest --test-dir build/port --output-on-failure

      # The macOS app, made and signed ad hoc as port/README.md says, with its signature checked by the script. It stays
      # on the runner: the port's compiled game code is never uploaded
      - name: Build the macOS app
        if: runner.os == 'macOS'
        run: cmake --build build/port --target frigate-black2_app

  # Windows, with MSYS2's CLANG64 environment: clang, lld, compiler-rt and the UCRT, with CMake, Ninja, SDL3 and Python
  # from its packages, as port/README.md tells a player to build, so that the build's GCC-style flags are the same as
  # on macOS and Linux (ADR 0013). The game's images, sounds and models under res/ (68,000 of its 119,000 files) aren't
  # checked out: the host build reads only its text and the data that the text's headers name
  # (port/tools/gen_host_tree.py). git keeps the files' line endings as they are
  host-windows:
    name: Host build (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    env:
      # The decomp's headers and data are UTF-8, and Python reads text in the ANSI code page on Windows without it
      PYTHONUTF8: "1"
    steps:
      - name: Keep line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/res/**/*.png
            !/res/**/*.wav
            !/res/**/*.glb

      # MSYS2's current packages, not pinned: the build takes any SDL3 3.4 (3.4.16 on the runner of 2026-10-18), and
      # the CLANG64 shell's PATH is MSYS2's own, so that its Python is the one CMake finds (port/CMakeLists.txt)
      - name: Install build tools
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-python

      - name: Show the tools
        run: |
          which clang cmake ninja python
          clang --version
          cmake --version
          python --version
          pacman -Q mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-python

      - name: Configure
        env:
          CC: clang
        run: cmake -S port -B build/port -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      # -k 0 on Windows alone, the newest host: one run shows every file that doesn't compile there, where a file that
      # builds on macOS and Linux may not; the other jobs stop at the first failure, as before
      - name: Build
        run: cmake --build build/port -- -k 0

      - name: Test
        run: ctest --test-dir build/port --output-on-failure

  macos-distribution:
    name: macOS distribution build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon, whose images install Rosetta (runner-images' arm64 templates run install-rosetta.sh), so the
        # app's x86_64 slice starts there too; and Intel, where ctest runs the tests that don't need the ROM on the
        # x86_64 slices natively. macOS 26 and 15 each, so that the app built for 11.0 also runs on a macOS older than
        # the SDK it is built with; macos-14 is deprecated, and its image has no Xcode 26, which needs macOS 15.6
        os: [macos-26, macos-26-intel, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      # No sdl3: the distribution build builds SDL3's pinned release for its own target and links it statically
      - name: Install build tools
        run: brew install ninja

      # The macOS 15 images default to Xcode 16.4; the newest Xcode 26 there links as the one overlay_sections_image_*'s
      # rules were measured with (port/tools/gen_overlay_sections.py), and its SDK is the one the macOS 26 runners build
      # with, or close to it
      - name: Use Xcode 26
        if: startsWith(matrix.os, 'macos-15')
        run: |
          # Xcode bundle names are controlled by the runner image and contain no newlines.
          # shellcheck disable=SC2012
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::the ${{ matrix.os }} image has no Xcode 26 (its readme of 2026-10-18 lists 26.0.1 to 26.3)"
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >>"$GITHUB_ENV"
          echo "$xcode: SDK $(DEVELOPER_DIR=$xcode/Contents/Developer xcrun --show-sdk-version)"

      # Apple Silicon must run the x86_64 slice too, which needs Rosetta: checked before the build, so that an image
      # without it stops here and says so. Installing it would accept Apple's licence on the runner, which isn't done
      - name: Check for Rosetta
        if: runner.arch == 'ARM64'
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            echo "::error::the ${{ matrix.os }} image has no Rosetta, so the app's x86_64 slice can't start here"
            exit 1
          fi
          echo "Rosetta runs x86_64 code on ${{ matrix.os }}"

      - name: Configure
        env:
          CC: clang
        run: cmake -S port -B build/port-dist -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPORT_MACOS_DISTRIBUTION=ON

      - name: Build
        run: cmake --build build/port-dist

      # ctest runs each program as the runner's own slice: arm64 on Apple Silicon, x86_64 on Intel. app_slices checks
      # the program's slices and macOS from its load commands; the tests that need the ROM skip, app_universal_slices
      # among them
      - name: Test
        run: ctest --test-dir build/port-dist --output-on-failure

      # The app and its disk image as port/README.md makes them, in one command; make_app.sh refuses a binary without
      # both slices or built for a newer macOS than 11.0, and package_macos.sh checks the app in the image. Both stay
      # on the runner
      - name: Build the app and its disk image
        run: port/tools/package_macos.sh --distribution

      # The finished app as another Mac meets it: both slices, macOS 11.0 in every load command and in the Info.plist,
      # no library from outside macOS, an ad hoc signature without the hardened runtime, and the program starting as
      # every slice: on Apple Silicon the x86_64 one under Rosetta too, so there every slice must start
      - name: Check the app
        run: |
          every=
          if [ "${{ runner.arch }}" = ARM64 ]; then every=--run-every-slice; fi
          port/app/macos/check_app.sh "build/port-dist/Frigate Black 2.app" --archs "arm64 x86_64" --minimum 11.0 $every

  # Frigate's sanitized build (port/docs/sanitizers.md): Black 2 under AddressSanitizer and UndefinedBehaviorSanitizer,
  # every report fatal (the program aborts on every host, and a report in a test's output fails the test, since no
  # test has WILL_FAIL), with its tests run under them: the OS core's scenarios on the fibers, the host seam's and the
  # platform layer's scenarios on the whole program's objects, the units. CI has no ROM, so of the routes that need no
  # oracle (ctest -L route -LE oracle) only the smoke test runs, as far as the program's look for the ROM, with the
  # replays' fixtures; the replays and the port's checks of the oracle's hashes skip, as in the host job, and the routes
  # themselves run only where the ROM is. Linux adds what Apple clang lacks: UndefinedBehaviorSanitizer's function
  # check for C, and LeakSanitizer at every program's exit, the smoke test's included. No run here reaches the game's
  # main(): the smoke test passes on the line the program logs before it looks for the ROM, which stops it, so its leak
  # check covers the program's start-up as far as that look
  sanitize:
    name: Sanitized build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl3

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgl-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Configure
        env:
          CC: clang
        run: cmake -S port -B build/port-san -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPORT_SANITIZE=ON

      - name: Build
        run: cmake --build build/port-san

      - name: Test, but the routes
        run: ctest --test-dir build/port-san -LE route --output-on-failure

      # The routes that need no oracle (those that need it are left out, since CI doesn't build it). Without the ROM
      # only the smoke test runs, and the replays' fixtures, which empty their save directories; the rest skip
      - name: The smoke test, the one route that runs without the ROM
        run: ctest --test-dir build/port-san -L route -LE oracle --output-on-failure

  # Exercises the maintainer's upstream merge policy in isolated Git repositories, without ROMs or secrets.
  sync-tooling:
    name: Sync tooling tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Test upstream sync policy
        run: python -m unittest discover -s port/tools/tests -p test_upstream_sync.py

  # A single stable required check: a failed, cancelled or skipped build must never make the PR mergeable.
  # Keep needs in sync with every build/test job above. Matrix jobs report success only when every leg succeeds.
  frigate-ci:
    name: Frigate CI
    if: ${{ always() }}
    needs: [host, host-windows, macos-distribution, sanitize, sync-tooling]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require every build and test
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = {name: job["result"] for name, job in jobs.items() if job["result"] != "success"}
          if failed:
              print(f"::error::Required Frigate jobs did not succeed: {failed}")
              sys.exit(1)
          print("Every required Frigate build and test succeeded.")
          PY
