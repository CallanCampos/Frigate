# The infrared link (irc), overlay 31's last two files: the frames between two machines (irc_link.c) over the card's
# infrared chip on the backup SPI bus (irc_spi.c). The name is ours; the ROM names neither file. Whether Game Freak or
# Nintendo wrote it is not known. It is built with the game's compiler and flags, and both files match whole, their
# text, pools, .data and .bss, in both versions. Each aligns one object (IrcSpi, IrcFrame): at -O4,p MWCC rotates the
# loops of a function and drops its empty loops unless the function reads an object with an explicit alignment, and
# the original's functions that read those two objects keep theirs. Until that was known the library was built at
# -O2,p, which rotates no loop and keeps empty ones, but there IrcLink_Checksum's loop, which the original rotates
# (it reads no object), matched only as a guarded do/while, and IrcLink_IsRecvIgnored's test of 2 or 3 as a switch.
compiler = "dsi/1.1p1"
flags = [
    "-O4,p",               # Optimize for speed
    "-proc arm946e",       # ARM9 processor
    "-thumb",              # Thumb code
    "-interworking",       # ARM/Thumb interworking
    "-enum int",           # Enums are int-sized
    "-char signed",        # char is signed
    "-fp soft",            # Software floating point
    "-lang=c99",
    "-Cpp_exceptions off", # No exception tables
    "-gccext,on",          # GCC extensions
    "-gccinc",             # #include "..." and <...> search the same paths
    "-inline on,noauto",   # Only inline functions marked inline
    "-ipa file",           # Interprocedural analysis within each file
    "-sym on",             # Debug info for objdiff
    "-requireprotos",      # Calling an undeclared function is an error
    "-nolink",
    "-msgstyle gcc",
]
