# TwlSDK's DSi libraries, built apart from the game: SCFG and the DSi system calls in ARM9 main, the camera, DSP,
# microphone, NWM, FATFS and sound and RTC extensions in the LTD autoload (ARM, file_flags below), and the SSP JPEG
# encoder and decoder and their EXIF writer and reader, linked into overlay 257 (the Xtransceiver). The SSP files take
# the game's compiler and flags: Thumb code at -O4,p (-O4,s and -O2 differ), where dsi/1.1 to dsi/1.3p1 compile them
# alike and dsi/1.6 does not; -ipa file, without which the files' statics are no longer addressed from one base; and
# -inline on,noauto, since -inline auto inlines small static functions that the ROM keeps.
compiler = "dsi/1.1p1"
flags = [
    "-O4,p",               # Optimize for speed
    "-proc arm946e",       # ARM9 processor
    "-thumb",              # Thumb code
    "-interworking",       # ARM/Thumb interworking
    "-enum int",           # Enums are int-sized
    "-char signed",        # char is signed
    "-fp soft",            # Software floating point
    "-lang=c99",
    "-Cpp_exceptions off", # No exception tables
    "-gccext,on",          # GCC extensions
    "-gccinc",             # #include "..." and <...> search the same paths
    "-inline on,noauto",   # Only inline functions marked inline
    "-ipa file",           # Interprocedural analysis within each file
    "-sym on",             # Debug info for objdiff
    "-requireprotos",      # Calling an undeclared function is an error
    "-nolink",
    "-msgstyle gcc",
]

# The photo signature code in the LTD autoload is ARM code
[file_flags]
"scfg/scfg_proc_itcm.c" = ["-nothumb"]
"photo_sign_client.c" = ["-nothumb"]
"photo_sign.c" = ["-nothumb"]
"photo_sign_util.c" = ["-nothumb"]

# The LTD autoload's TwlSDK libraries are ARM code. camera_api.c, nwm_setup.c and nwm.c load each static through a
# literal of their own, as -ipa function does (-ipa file reaches them all from one base, and drops camera_api.c's
# unreferenced word), while nwm_events.c reaches its three from one base, so it takes the default -ipa file;
# fatfs_api.c is -O2,p, since -O4,p and -O3,p rotate its loops and fold its reloads
"rtc/rtc_api_ex.c" = ["-nothumb"]
"camera/camera_api.c" = ["-nothumb", "-ipa function"]
"camera/camera.c" = ["-nothumb"]
"card/card_rom_twl.c" = ["-ipa function"]
# The DSi part of os_application_jump.c is ARM code, as main's half is; the statics of mi_sharedWram_twl.c and
# pm_twl.c each have a literal of their own, as under -ipa function
"mi/mi_sharedWram_twl.c" = ["-ipa function"]
"os/os_application_jump_twl.c" = ["-nothumb"]
"spi/pm_twl.c" = ["-ipa function"]
"nwm/nwm_setup.c" = ["-nothumb", "-ipa function"]
"nwm/nwm_events.c" = ["-nothumb"]
"nwm/nwm.c" = ["-nothumb", "-ipa function"]
"mic/mic_twl.c" = ["-nothumb"]
"fatfs/fatfs_api.c" = ["-nothumb", "-O2,p", "-ipa function"]
"snd/sndex.c" = ["-nothumb"]
"dsp/dsp_if.c" = ["-nothumb"]
"dsp/dsp_process.c" = ["-nothumb"]
"dsp/dsp_audio.c" = ["-nothumb"]
"dsp/dsp_pipe.c" = ["-nothumb"]
"dsp/dsp_g711.c" = ["-nothumb"]
"dsp/dsp_graphics.c" = ["-nothumb"]

# TwlSDK's system call library was built with NitroSystem's compiler, 2.0/sp2p2: its LTD half's HMAC-SHA-1 matches
# under it and under no dsi compiler, which index its pad loops and keep the context's address in a register, and its
# ARM9 main half matches under both, so both files take it. The rest of the library needs dsi/1.1p1: built with
# 2.0/sp2p2, 20 of its other files lose matches (camera, NWM, DSP, JPEG and the others) and none gains any
[file_compilers]
"syscall/syscall_twl.c" = "2.0/sp2p2"
"syscall/syscall_twl_ltd.c" = "2.0/sp2p2"
