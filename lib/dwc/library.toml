# Nintendo's DWC (Wi-Fi Connection), built apart from the game with dsi/1.2. Every file compiles alike under dsi/1.1p1
# and dsi/1.2 in both versions except dwc_account.c, whose DWCi_Acc_CreateTempLoginId loads entropy[i] through its own
# indexed address only from dsi/1.2 on (to dsi/1.3p1), as the original does. Most of DWC in
# overlays 189 and 260 is Thumb code, so Thumb is the default here; the voice chat library libVCT (overlay 29, vct/) is
# ARM code at -O4,p and is set per file below. Probed on libVCT in all of dsi/1.1 to dsi/1.6sp2, 2.0/* and 1.2/*: dsi/1.1
# to dsi/1.6sp2 compile it alike and best (41 of its first 96 functions matched at dsi/1.1p1, 31 at 2.0/*, 17 at
# 1.2/sp3 and sp4, 10 at 1.2/base), -O4,s and -O2 match 28 and 27, and -inline made no gain. Other parts that differ
# take their own file_flags entry.
compiler = "dsi/1.2"
flags = [
    "-O4,p",               # Optimize for speed
    "-proc arm946e",       # ARM9 processor
    "-thumb",              # Thumb code
    "-interworking",       # ARM/Thumb interworking
    "-enum int",           # Enums are int-sized
    "-char signed",        # char is signed
    "-fp soft",            # Software floating point
    "-lang=c99",
    "-Cpp_exceptions off", # No exception tables
    "-gccext,on",          # GCC extensions
    "-gccinc",             # #include "..." and <...> search the same paths
    "-sym on",             # Debug info for objdiff
    "-requireprotos",      # Calling an undeclared function is an error
    "-nolink",
    "-msgstyle gcc",
]

# libVCT is ARM code; vct.c and vct_audio.c also reach their statics from one base, as -ipa file does (vct_audio.c's
# .bss is size-sorted, with the u16 first), and vct_session.c has its four 66-byte transition tables 4-aligned in
# sections of their own, which only -ipa file gives
[file_flags]
"vct/vct_adpcm.c" = ["-nothumb"]
"vct/vct_audio.c" = ["-nothumb", "-ipa file"]
"vct/vct_buffer.c" = ["-nothumb"]
"vct/vct_session.c" = ["-nothumb", "-ipa file"]
# vct_dsp.c was one file once, but the ROM's range of it is four, each with its own `-ipa file` layout: the `.bss` runs
# `sPacketPool`; `sNoiseFloor` with `E2scales`; and `sEcho` with its arrays and buffers are each sorted by size
# (the 2-byte `shift` first), which one file's statics could not be. The packet pool and the mixer compile alike with
# or without it
"vct/vct_packet_pool.c" = ["-nothumb"]
"vct/vct_vad.c" = ["-nothumb", "-ipa file"]
"vct/vct_dsp.c" = ["-nothumb", "-ipa file"]
"vct/vct_mixer.c" = ["-nothumb"]
"vct/vct.c" = ["-nothumb", "-ipa file"]
# The signature check (overlay 189) is ARM code like NitroSDK's
"crypt/crypt.c" = ["-nothumb"]
# NHTTP (overlay 189) reaches the statics of its common file from one base, as -ipa file does
"nhttp/d_nhttp_common.c" = ["-ipa file"]
# So does the HTTP client's comm thread: its 76-byte content type string has a section of its own, which only -ipa file
# gives an object of 64 bytes or more
"nhttp/nhttp_thread.c" = ["-ipa file"]
# So does the file of DWC that wraps the GameSpy HTTP client (overlay 189)
"ghttp/dwc_ghttp.c" = ["-ipa file"]
# So does the encrypted session (overlay 189): its 160-byte client has a .data section of its own after the base URL,
# reached through a literal of its own, which only -ipa file gives an object of 64 bytes or more
"enc/dwc_encsession.c" = ["-ipa file"]
# ghttpEncryption.c's function names (__FUNCTION__) are sorted by size ahead of its other data, as -ipa file sorts them
"ghttp/ghttpEncryption.c" = ["-ipa file"]
# The authentication service (overlay 260) has its 257-byte RSA modulus in a section of its own, 4-aligned after the
# exponent, which only -ipa file gives
"auth/AuthService.c" = ["-ipa file"]
# The connection test (overlay 11) reaches its globals from one base
"auth/dwc_conntest.c" = ["-ipa file"]
# The profanity check (overlay 11) has DWCi_Prof_ParseResponse's local table of field names, and its strings, at the head
# of its .data, as -ipa file sorts local initializers ahead of the functions' strings
"auth/dwc_profanity.c" = ["-ipa file"]
# Each root certificate of the HTTPS connection (overlay 11) is a file of its own whose name and key, of 64 bytes or
# more, are 4-aligned in sections of their own, which only -ipa file gives
"auth/dwc_rootcert_baltimore_cybertrust.c" = ["-ipa file"]
"auth/dwc_rootcert_globalsign.c" = ["-ipa file"]
"auth/dwc_rootcert_gte_cybertrust_global.c" = ["-ipa file"]
"auth/dwc_rootcert_gte_cybertrust.c" = ["-ipa file"]
"auth/dwc_rootcert_globalsign_r2.c" = ["-ipa file"]
"auth/dwc_rootcert_nintendo.c" = ["-ipa file"]
"auth/dwc_rootcert_nintendo_class2.c" = ["-ipa file"]
"auth/dwc_rootcert_thawte_premium_server.c" = ["-ipa file"]
"auth/dwc_rootcert_thawte_server.c" = ["-ipa file"]
"auth/dwc_rootcert_verisign_class3_g2.c" = ["-ipa file"]
"auth/dwc_rootcert_verisign_class3_g3.c" = ["-ipa file"]
"auth/dwc_rootcert_verisign_class3.c" = ["-ipa file"]
"auth/dwc_rootcert_rsa_secure_server.c" = ["-ipa file"]
# GameSpy's NAT detection and negotiation (overlay 11) reach their statics from one base too
"natneg/NATify.c" = ["-ipa file"]
"natneg/natneg.c" = ["-ipa file"]
# And two files of GameSpy's server browser (overlay 11): a server's shared texts and null server, and the list's master
# server and sorted list
"serverbrowsing/sb_server.c" = ["-ipa file"]
"serverbrowsing/sb_serverlist.c" = ["-ipa file"]

# ARM9 main's DWC (account, auto-connect, backup and WDS) is ARM code; dwc_nvram.c reaches its three statics from one
# base, as -ipa file does
"bm/dwc_backup.c" = ["-nothumb"]
"bm/dwc_bm_init.c" = ["-nothumb"]
"bm/util_wifiidtool.c" = ["-nothumb"]
"base/dwc_account.c" = ["-nothumb"]
"base/dwc_base64.c" = ["-nothumb"]
"base/dwc_error.c" = ["-nothumb"]
"base/dwc_init.c" = ["-nothumb", "-ipa file"]
"base/dwc_memfunc.c" = ["-nothumb"]
"wds/wds.c" = ["-nothumb"]
"ac/dwc_ac_wcm.c" = ["-nothumb"]
"ac/dwc_ac_cleanup.c" = ["-nothumb"]
"ac/dwc_ac_connect.c" = ["-nothumb"]
"ac/dwc_ac.c" = ["-nothumb"]
"base/dwc_connectinet.c" = ["-nothumb"]
"ac/dwc_ac_result.c" = ["-nothumb"]
"ac/dwc_ac_aplist.c" = ["-nothumb"]
"base/dwc_wdsscan.c" = ["-nothumb"]
"ac/dwc_ac_search.c" = ["-nothumb"]
"ac/dwc_ac_wepkey.c" = ["-nothumb"]
"ac/dwc_ac_soc.c" = ["-nothumb"]
"bm/dwc_nvram.c" = ["-nothumb", "-ipa file"]
"bm/dwc_bm_check.c" = ["-nothumb"]
